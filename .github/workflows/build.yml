name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux-x64-zip:
    name: Linux x64 (zip)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build Linux x64 zip
        run: ./build/pack.sh --platform linux-x64 --format zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-linux-x64-zip
          path: dist/Calculator-linux-x64.zip
          retention-days: 30

  build-linux-x64-snap:
    name: Linux x64 (snap)
    runs-on: ubuntu-22.04
    needs: build-linux-x64-zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic --channel 7.x

      - name: Build Linux x64 snap
        run: ./build/pack.sh --platform linux-x64 --format snap

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-linux-x64-snap
          path: build/*.snap
          retention-days: 30

  build-linux-arm64-zip:
    name: Linux ARM64 (zip)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install ARM64 cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build Linux ARM64 zip
        run: ./build/pack.sh --platform linux-arm64 --format zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-linux-arm64-zip
          path: dist/Calculator-linux-arm64.zip
          retention-days: 30

  build-android-debug:
    name: Android Debug (arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build Android Debug APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: dotnet publish src/Calculator.Mobile/Calculator.Mobile.csproj -f net9.0-android -r android-arm64 -c Debug

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-android-arm64-debug
          path: src/Calculator.Mobile/bin/
          retention-days: 30

  build-android-release:
    name: Android Release (all ABIs)
    runs-on: ubuntu-latest
    needs: build-android-debug

    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Decode Android Keystore
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          if [[ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src/Calculator.Mobile/Android/calc-prod.keystore
            echo "Keystore decoded"
          else
            echo "WARNING: ANDROID_KEYSTORE_BASE64 secret not set, using unsigned build"
          fi

      - name: Build Android C++ Engine
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash src/CalcManager/build_android.sh ${{ matrix.abi }}

      - name: Build Android Release APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # 映射 ABI 到 .NET RID
          case "${{ matrix.abi }}" in
            armeabi-v7a) rid="android-arm" ;;
            arm64-v8a)   rid="android-arm64" ;;
            x86)         rid="android-x86" ;;
            x86_64)      rid="android-x64" ;;
          esac

          dotnet publish src/Calculator.Mobile/Calculator.Mobile.csproj \
            -f net9.0-android \
            -r "$rid" \
            -c Release \
            /p:AndroidSigningKeyStorePassword="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            /p:AndroidSigningKeyPassword="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-android-${{ matrix.abi }}-release
          path: src/Calculator.Mobile/bin/
          retention-days: 30
