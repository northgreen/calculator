name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux-x64-zip:
    name: Linux x64 (zip)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build Linux x64 zip
        run: ./build/pack.sh --platform linux-x64 --format zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-linux-x64-zip
          path: dist/Calculator-linux-x64.zip
          retention-days: 30

  build-linux-x64-snap:
    name: Linux x64 (snap)
    runs-on: ubuntu-22.04
    needs: build-linux-x64-zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic --channel 7.x

      - name: Build Linux x64 snap
        run: ./build/pack.sh --platform linux-x64 --format snap

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-linux-x64-snap
          path: build/*.snap
          retention-days: 30

  build-linux-arm64-zip:
    name: Linux ARM64 (zip)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install ARM64 cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build Linux ARM64 zip
        run: ./build/pack.sh --platform linux-arm64 --format zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-linux-arm64-zip
          path: dist/Calculator-linux-arm64.zip
          retention-days: 30
